<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https:; base-uri 'none'; form-action 'none'">
<title>ChromeXt Zygisk</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<header><div class="mark">CX</div><div><div class="eyebrow">ChromeXt · Zygisk</div><h1>ChromeXt 管理中心</h1></div></header>
<nav class="actions tabs"><button id="tab-scope">注入</button><button id="tab-library">脚本</button><button id="tab-logs">日志</button></nav>
<section id="scope-page">
<section class="card"><div id="status" role="status" aria-live="polite">正在读取模块配置…</div><p>仅注入选中的受支持浏览器主进程。保存后强制停止对应浏览器，再重新打开。脚本分配不受影响。</p><div class="actions"><button id="reload">刷新</button><button id="all" disabled>全选已安装</button><button id="none" disabled>全部取消</button></div></section>
<label class="search"><input type="search" id="query" placeholder="搜索浏览器或包名" aria-label="搜索浏览器"></label>
<div id="list"></div><p id="empty" hidden>没有匹配的已安装浏览器。</p>
<footer><span id="count">已选择 0 个</span><button id="save" disabled>保存注入范围</button></footer>
</section>
<section id="library-page" hidden><section class="card"><h2>脚本库</h2><p id="lib-status" role="status">正在加载…</p><div class="actions"><button id="lib-load">刷新</button><button id="lib-import">导入 / 新建</button><button id="lib-export">全部导出</button></div><button id="lib-sync" disabled>同步浏览器本地脚本</button><p>修改后保存，再强制停止并重新打开浏览器。导入默认不启用。</p></section>
<input type="search" id="lib-query" placeholder="搜索脚本名称或 ID">
<div id="lib-list"></div><button id="lib-save" disabled>保存脚本库</button>
<section class="card" id="editor" hidden><h2 id="editor-title">导入或编辑脚本</h2><input id="script-file" type="file" accept=".js,.json,.txt" multiple><input type="url" id="script-url" placeholder="HTTPS 脚本链接（支持跨域时）"><button id="fetch-url">获取链接源码</button><textarea id="source" rows="12" placeholder="粘贴脚本源码或 ScriptHub JSON 备份"></textarea><div class="actions"><button id="editor-cancel">取消</button><button id="editor-apply">确认</button></div></section>
<section id="export-panel" class="card" hidden><h2>导出脚本</h2><textarea id="export-text" rows="10" readonly></textarea><div class="actions"><button id="export-copy">复制</button><button id="export-download">下载</button><button id="export-close">关闭</button></div></section>
</section>
<section id="logs-page" hidden><section class="card"><h2>运行诊断</h2><p>仅显示 ChromeXt 日志，不读取其他应用的日志。</p><div class="actions"><button id="logs-refresh">读取日志</button><button id="logs-copy">复制</button><button id="logs-clear">清空显示</button></div><textarea id="logs-text" rows="20" readonly></textarea></section></section>
</main><script src="app.js" defer></script><script src="library.js" defer></script></body></html>
