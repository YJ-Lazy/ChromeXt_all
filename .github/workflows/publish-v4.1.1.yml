name: Publish v4.1.1
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/publish-v4.1.1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build APK
        run: ./gradlew app:assembleDebug
      - name: Validate release build
        run: ./gradlew app:assembleRelease
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -q 'versionName = "4.1.1"' app/build.gradle.kts
          cp app/build/outputs/apk/debug/app-debug.apk ScriptHub-v4.1.1.apk
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify ScriptHub-v4.1.1.apk
          gh release create v4.1.1 ScriptHub-v4.1.1.apk --target "$GITHUB_SHA" --title "ScriptHub v4.1.1" --latest --notes-file - <<'NOTES'
          ## 更新内容
          - 新增脚本批量导入和导出，支持多选及全选导出
          - 支持单个 user.js 文件及多个脚本 JSON 备份
          - 本地导入自动跳过重复或无效脚本，默认不启用
          - 更新 README
          
          本次发布 Debug 签名 APK。不同构建的签名可能不同，覆盖安装失败时请先备份数据。其他浏览器及新增导入功能仍需真机验证。
          NOTES
