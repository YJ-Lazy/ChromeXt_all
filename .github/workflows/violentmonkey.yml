name: Violentmonkey upstream validation
on:
  push:
    branches: [master, violentmonkey-port]
  workflow_dispatch:
jobs:
  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: violentmonkey/violentmonkey
          ref: ee542a677cf7fb6994ccaa9027657f975be074f2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g corepack && corepack enable
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: violentmonkey-upstream-build
          path: dist/
          if-no-files-found: error
  android-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - run: ./gradlew app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-hook-baseline-not-violentmonkey
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
