name: Publish v4.0.0
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/publish-v4.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build APK
        run: ./gradlew app:assembleDebug
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -q 'versionName = "4.0.0"' app/build.gradle.kts
          cp app/build/outputs/apk/debug/app-debug.apk ChromeXt-v4.0.0.apk
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify ChromeXt-v4.0.0.apk
          gh release create v4.0.0 ChromeXt-v4.0.0.apk --target "$GITHUB_SHA" --title "ChromeXt v4.0.0" --latest --notes-file - <<'NOTES'
          ## 更新内容
          - 新增 APP 独立脚本管理及网址导入
          - 支持跨浏览器脚本分配、同步及独立启停
          - 优化夸克及 Chrome 158 适配
          - 开放浏览器适配范围
          - 独立日志及可选 Root 增强诊断
          - 更新 README
          
          本次发布 Debug 签名 APK。不同构建的签名可能不同，覆盖安装失败时请先备份数据。其他浏览器及新增导入功能仍需真机验证。
          NOTES
