name: ChromeXt Zygisk standalone CI
on:
  push:
    branches: [zygisk-standalone]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build separate manager APK
        run: ./gradlew app:assembleDebug
      - name: Use existing signing key when configured
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::warning::Using CI debug signing key. Upgrading from an APK signed by another key will fail safely."
            exit 0
          fi
          APK=app/build/outputs/apk/debug/app-debug.apk
          KEYSTORE="$(mktemp "$RUNNER_TEMP/chromext-key.XXXXXX")"
          trap 'rm -f "$KEYSTORE" "$APK.signed.apk"' EXIT
          printf '%s' "$SIGNING_KEY" | base64 -d > "$KEYSTORE"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEY_STORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$APK.signed.apk" "$APK"
          "$APKSIGNER" verify "$APK.signed.apk"
          mv "$APK.signed.apk" "$APK"
          rm -f "$APK.signed.apk.idsig"
      - name: Verify no Xposed module entry
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("app/build/outputs/apk/debug/app-debug.apk") as z:
              assert "assets/xposed_init" not in z.namelist()
              for name in ["GM.js", "scripts.js", "editor.js", "eruda.js", "encoding.js"]:
                  assert z.getinfo("assets/" + name).file_size
          PY
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print app/build/outputs/apk/debug/app-debug.apk > /tmp/manifest.xml
          ! grep -F 'android:name="xposedmodule"' /tmp/manifest.xml
      - name: Prepare NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK root is not configured"
            exit 1
          fi
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          if [ ! -x "$SDK_MANAGER" ]; then
            echo "::error::Android SDK command-line tools not found under $SDK_ROOT"
            exit 1
          fi
          NDK_ROOT="$SDK_ROOT/ndk/29.0.14206865"
          if [ ! -f "$NDK_ROOT/build/cmake/android.toolchain.cmake" ]; then
            "$SDK_MANAGER" --sdk_root="$SDK_ROOT" 'ndk;29.0.14206865'
          fi
          test -f "$NDK_ROOT/build/cmake/android.toolchain.cmake"
          echo "ANDROID_NDK_HOME=$NDK_ROOT" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/chromext-build-tools"
          "$RUNNER_TEMP/chromext-build-tools/bin/python" -m pip install 'cmake>=3.28,<4' 'ninja>=1.11,<2'
          echo "$RUNNER_TEMP/chromext-build-tools/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/chromext-build-tools/bin/cmake" --version
          "$RUNNER_TEMP/chromext-build-tools/bin/ninja" --version
      - name: Build Zygisk module
        run: bash zygisk/build.sh
      - name: Upload manager APK for failed builds
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ChromeXt-Zygisk-Manager-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
      - name: Upload Zygisk ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ChromeXt-Zygisk-arm64-exp
          path: zygisk/build/ChromeXt-Zygisk-arm64-exp.zip
          if-no-files-found: error
