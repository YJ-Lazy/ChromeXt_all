name: Publish v4.2
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/publish-v4.2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build APK
        run: ./gradlew app:assembleDebug
      - name: Validate release build
        run: ./gradlew app:assembleRelease
      - name: Verify bundled module assets
        run: |
          python3 - <<'PY'
          import glob, zipfile
          required = {"GM.js", "scripts.js", "editor.js", "editor.css", "devtools.js", "eruda.js", "eruda.css", "encoding.js", "xposed_init"}
          apks = glob.glob("app/build/outputs/apk/*/*.apk")
          assert apks, "No APK found"
          for apk in apks:
              with zipfile.ZipFile(apk) as z:
                  for name in required:
                      assert z.getinfo("assets/" + name).file_size > 0, (apk, name)
                  gm = z.read("assets/GM.js").decode()
                  assert "GM.bootstrap" in gm and "globalThis" in gm
                  assert "Kotlin separator" in z.read("assets/scripts.js").decode()
                  print("Validated:", apk)
          PY
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print app/build/outputs/apk/debug/app-debug.apk | grep -F 'org.matrix.chromext.diagnostics'
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print app/build/outputs/apk/debug/app-debug.apk | grep -F 'org.matrix.chromext.scriptpolicy'

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -q 'versionName = "4.2"' app/build.gradle.kts
          cp app/build/outputs/apk/debug/app-debug.apk ScriptHub-v4.2.apk
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify ScriptHub-v4.2.apk
          cat > release-notes.md <<'NOTES'
          ## 更新内容
          - 修复模块资源读取失败及 GM.js、Local 初始化异常，恢复用户脚本运行。
          - 修复跨进程脚本策略同步，保留按浏览器启停配置。
          - 优化 Chrome 菜单资源加载及异常回退。
          - 优化夸克 UC/U4 脚本注入时序，减少漏注入和重复执行。
          - 增加 Eruda 初始化结果及网页脚本管理器握手诊断。
          - 保留新版 UI、批量导入导出及独立模块日志。
          
          - 优化 Tampermonkey 元数据解析、批量 GM 存储 API 和资源读取。
          - 优化脚本 URL 导入、源码粘贴及夸克网页安装入口。
          - 支持脚本编辑、更新、自定义滑动操作及单脚本 5 MiB 上限。

          已收到最新构建可用反馈；完整 Tampermonkey API 和其他浏览器兼容仍需进一步验证。
          
          本次发布 Debug 签名 APK。覆盖安装前建议备份脚本；若签名不同，可能无法直接覆盖安装。更新后请强制停止目标浏览器再打开。
          NOTES
          if gh release view v4.2 >/dev/null 2>&1; then
            gh release upload v4.2 ScriptHub-v4.2.apk --clobber
            gh release edit v4.2 --notes-file release-notes.md
          else
            gh release create v4.2 ScriptHub-v4.2.apk --target "$GITHUB_SHA" --title "ScriptHub v4.2" --latest --notes-file release-notes.md
          fi
